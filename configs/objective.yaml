
# RailPulse-X Impact Objective Weights
# J(a) = wp*passenger_delay + wt*train_delay + wc*connection_miss
#       + wf*platform_conflict + wk*crew_disruption + wr*operational_risk

weights:
  passenger_delay: 0.35
  train_delay: 0.25
  connection_miss: 0.20
  platform_conflict: 0.10
  crew_disruption: 0.05
  operational_risk: 0.05

risk:
  lambda_cvar: 0.30
  cvar_alpha: 0.90

constraints:
  min_headway_minutes: 5
  min_dwell_minutes: 2
  max_platform_occupancy: 1
  max_speed_kmh: 120
  min_connection_buffer_minutes: 10
